schema_version: 1

context:
  name: markdownify
  version: "1.2.4"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/markdownify-${{ version }}.tar.gz
  sha256: 3837f5eb4caa627473451f9ebb91e00d0f12120fc64d64246bea23934244bd01

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - markdownify = markdownify.main:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.2
  run:
    - python >=${{ python_min }}
    - beautifulsoup4 >=4.9,<5

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - markdownify
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - pip check
      - markdownify --help

about:
  summary: Convert HTML to markdown.
  license: MIT
  license_file: LICENSE
  homepage: http://github.com/matthewwithanm/python-markdownify

extra:
  recipe-maintainers:
    - davidbrochart
    - gscoppino
    - moritzwilksch
